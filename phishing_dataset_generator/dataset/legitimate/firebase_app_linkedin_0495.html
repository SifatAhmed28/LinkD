            box-shadow: inset 0 0 0 2px rgba(26, 115, 232, 0.85);

        .capture-submit {
            position: absolute;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 7px;
            background: transparent;
            cursor: pointer;
            z-index: 11;
